upstream passwdman2_backend {
  server backend:8000;
}

upstream passwdman2_frontend {
  server frontend:80;
}

server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://passwdman2_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }

  location = /sw.js {
    proxy_pass http://passwdman2_frontend;
    add_header Cache-Control "no-cache" always;
  }

  location = /manifest.webmanifest {
    proxy_pass http://passwdman2_frontend;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location /assets/ {
    proxy_pass http://passwdman2_frontend;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_pass http://passwdman2_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache" always;
  }
}
